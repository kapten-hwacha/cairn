name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.1.0 or mac-v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  release-macos:
    name: Build & Release macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Cairn macOS ${{ inputs.tag }}"
          releaseBody: "macOS (Apple Silicon) desktop release."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
