name: Release (iPadOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. ipados-v0.1.0)"
        required: true
        default: "ipados-v0.1.0"

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  release-ipados:
    name: Build & Release iPadOS (arm64)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci
      - run: npm run typecheck
      - name: Build Rust & frontend for iPadOS
        run: npm run ios:prep
      - name: Initialize iOS bundle files & generate Xcode project
        run: |
          if [ ! -d "src-tauri/gen/apple/cairn_iOS" ]; then
            cp src-tauri/gen/apple/project.yml /tmp/project.yml.bak
            npm run tauri -- ios init --ci
            cp /tmp/project.yml.bak src-tauri/gen/apple/project.yml
          fi
          xcodegen generate --spec src-tauri/gen/apple/project.yml
      - name: Archive unsigned iPadOS build
        run: |
          xcodebuild \
            -project src-tauri/gen/apple/cairn.xcodeproj \
            -scheme cairn_iOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Cairn-iPadOS.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R build/Cairn-iPadOS.xcarchive/Products/Applications/Cairn.app build/Payload/Cairn.app
          (cd build && zip -r Cairn-iPadOS-unsigned.ipa Payload)
      - name: Publish iPadOS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Cairn iPadOS ${{ inputs.tag }}"
          body: "iPadOS unsigned `.ipa` release (sideload / re-sign with your Apple Developer profile)."
          files: build/Cairn-iPadOS-unsigned.ipa
