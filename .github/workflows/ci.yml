name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Validate iOS configuration
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.ios.conf.json", "utf8"));
            if (!conf.bundle?.iOS) throw new Error("Missing bundle.iOS config");
            if (!conf.app?.windows?.[0]?.fullscreen) throw new Error("iOS window must be fullscreen");
            console.log("tauri.ios.conf.json configuration valid");
          '

  macos:
    name: macOS & iPadOS checks (macos-15)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Setup Rust (macOS + iPadOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci
      - name: Native renderer tests on macOS
        run: npx tsx --test tests/files/pdf-native-render.test.ts tests/files/pdf-ops.test.ts tests/render/svg-native-render.test.ts tests/infra/browser-service.test.ts
        env:
          NODE_ENV: test
      - run: npm run build
      - run: npm run vite:build
      - name: Check provider runtime smoke
        run: node scripts/smoke-provider-runtime.mjs
      - name: Cargo tests (macOS)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Cargo check (iPadOS aarch64-apple-ios)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios
